<!DOCTYPE html>
<html id="uBO-popup-panel" class="desktop easyExperience">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="css/default.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/fa-icons.css">
<link rel="stylesheet" href="css/filtering-mode.css">
<link rel="stylesheet" href="css/popup.css">
<title data-i18n="extName"></title>
</head>

<body class="loading busy">
<div id="peaceMoment" role="status" aria-live="polite" aria-label="PagePeace protection is on">
    <div class="peaceMark" aria-hidden="true">
        <svg viewBox="0 0 96 112"><path d="M48 5 84 19v28c0 26-14 46-36 59C26 93 12 73 12 47V19L48 5Z"/><path class="peacePlus" d="M48 30v34M31 47h34"/></svg>
    </div>
    <strong>PagePeace is on</strong>
    <span>This page can breathe easier.</span>
</div>

<main>
    <div id="experienceSwitcher" aria-label="Interface mode">
        <button type="button" data-experience="easy" aria-pressed="true">Simple</button>
        <button type="button" data-experience="expert" aria-pressed="false">Advanced</button>
    </div>
    <div id="hostname"><span></span>&shy;<span></span></div>
    <!-- -------- -->
    <section id="easyPanel">
        <div id="easyProtectionState">Protection is on</div>
        <p>Move the slider to choose how quietly PagePeace protects this website.</p>
        <div class="filteringModeSlider">
            <div class="filteringModeButton"><div></div></div>
            <span data-level="0" aria-label="filteringMode0Name"></span>
            <span data-level="1" aria-label="filteringMode1Name"></span>
            <span data-level="2" aria-label="filteringMode2Name"></span>
            <span data-level="3" aria-label="filteringMode3Name"></span>
        </div>
        <div id="filteringModeText"><label data-i18n="popupFilteringModeLabel">_</label><br><span>_</span><span></span></div>
        <label id="pauseDurationLabel">Pause length
            <select id="pauseDuration"><option value="10">10 minutes</option><option value="60">1 hour</option><option value="0">Until I turn it back on</option></select>
        </label>
        <button type="button" id="easyPause">Pause on this site</button>
        <button type="button" id="easyRepair">Site broken? Relax one level</button>
        <button type="button" id="easySettings">All protection settings</button>
    </section>
    <div id="expertHeading"><strong>Advanced site controls</strong><small>Choose a detailed preset and use page tools.</small></div>
    <div id="advancedLevels">
        <button type="button" data-easy-level="1"><strong>Standard</strong><small>Reliable blocking with the fewest site issues</small></button>
        <button type="button" data-easy-level="2"><strong>Strong</strong><small>Recommended balance of privacy and compatibility</small></button>
        <button type="button" data-easy-level="3"><strong>Maximum</strong><small>Strongest protection; some sites may need permission</small></button>
    </div>
    <!-- -------- -->
    <div class="toolMenu localTools needHTTP">
        <label data-i18n="popupLocalToolsLabel"></label>
        <span id="gotoZapper" class="tool enabled" tabindex="0">
            <span class="fa-icon">bolt</span>
            <span data-i18n="zapperTipEnter">_</span>
        </span>
        <span id="gotoPicker" class="tool enabled" tabindex="0">
            <span class="fa-icon">eye-slash</span>
            <span data-i18n="pickerTipEnter">_</span>
        </span>
        <span id="gotoUnpicker" class="tool" tabindex="0">
            <span class="fa-icon">eye-open</span>
            <span data-i18n="unpickerTipEnter">_</span>
        </span>
        <span id="gotoReport" class="tool enabled" tabindex="0">
            <span class="fa-icon">comment-alt</span>
            <span data-i18n="popupTipReport">_</span>
        </span>
    </div>
    <!-- -------- -->
    <div class="toolRibbon globalTools">
        <span id="gotoMatchedRules" class="fa-icon tool" tabindex="0" title="Show matched rules">list-alt<span class="caption">Show matched rules</span></span>
        <span id="gotoDashboard" class="fa-icon tool enabled" tabindex="0" data-i18n-title="popupTipDashboard">cogs<span class="caption" data-i18n="popupTipDashboard"></span></span>
    </div>
</main>
<aside>
    <span class="fa-icon">spinner</span>
</aside>

<script src="js/theme.js" type="module"></script>
<script src="js/fa-icons.js" type="module"></script>
<script src="js/i18n.js" type="module"></script>
<script src="js/popup.js" type="module"></script>

</body>

</html>
